<!DOCTYPE html>
<html>
<head>
  <title>Register Page</title>
  <link rel="stylesheet" href="css/resgister.css">
  <link rel="icon" type="image/x-icon" href="images/logo.jpg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  
</head>
<body>
    
  <div class="container">
    
    <form id="registerForm" action="login.html" method="post">
        <h1 style="font-size: x-large;">Create New Account</h1>
        
        <label> First Name: </label>
        <input type="text" id="userName" placeholder="Enter your FirstName" required>
        
        <label> Last Name: </label>
        <input type="text" id="last" placeholder="Enter your LastName" required>
        
        <label> Email: </label>
        <input type="text" id="email" placeholder="Enter your Email" required>
        
        <label>Password: </label>
        <input type="password" id="pass" placeholder="Enter your Password" required>
        
        <label> Contact:</label>
        <input type="number" id="mobile" placeholder="Enter your PhoneNO" required>
        
        <label> Gender:</label>
        <input type="text" id="gender" placeholder="Enter your Gender" required>
        
        <button type="submit" class="btn">Submit</button>
        
        <p class="login-text">
         Already registered? <a href="login.html">Login here</a>
        </p>
    </form>
  </div>

  <script src="js/script.js"></script>
  
</body>
</html>
