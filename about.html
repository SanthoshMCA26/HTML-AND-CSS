<!DOCTYPE html>
<html>
<head>
  <title>SwiftCart</title>
  <link rel="stylesheet" href="css/resgister.css">
  <link rel="icon" type="image/x-icon" href="images/cartLogo.jpg">
</head>
<body>
    
  <div class="container">
    <form>
        <h1 style=" font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: rgb(34, 227, 108);">Register Form</h1>
        <label> First Name: </label>
        <input type="text" id="UserName" placeholder="Enter your FirstName" required>
        <label> Last Name: </label>
        <input type="text" id="last" placeholder="Enter your lastName " required>
        <label> Email: </label>
        <input type="text" id="email" placeholder="Enter your Email" required>
        <label>Password: </label>
        <input type="password"  id="pass" placeholder="Enter your Password" required>
        <label> Contact:</label>
        <input type="number" id="mobile" placeholder="Enter your PhoneNO" required>
        <label> Gender:</label>
        <input type="text" id="gender" placeholder="Enter your Gender" required>
        <button class="btn" onclick="window.open('cartLogin.html','_blank')">submit</button>
        <p class="login-text">
         Already registered? <a href="cartLogin.html">Login here</a>
        </p>
        

        
  </form>
  </div>
  <script src="js/script.js"></script>
 
  
</body>
</html>
