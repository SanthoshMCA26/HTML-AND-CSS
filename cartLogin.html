<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="cart.css">
    

</head>
<body>
    <h1 style="text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Login To SwiftCart</h1>
    <div class="loginContainer">
        <section>
            <input type="text"  id="user" placeholder="Enter your mail id" required><br>
            <input type="password" id="password" placeholder="Enter your password" required><br>
            
            <label>
                <input type="checkbox" id="showPassword" 
                onchange="document.getElementById('password').type = this.checked ? 'text' : 'password'">Show Password
            </label>
                           
            <button class="login">Log In</button>
        </section>
    </div>
    
</body>
</html>
