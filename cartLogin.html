<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/Login.css">
    <link rel="icon" type="image/x-icon" href="images/cartLogo.jpg">
    

</head>
<body>
    
    <div class="loginContainer">
        <!-- <a href="about.html" class="signup">Don't have an account?"Singn up"</a> -->
        <section>
            <h1 style="text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;" >Login To SwiftCart</h1>
            <input type="text"  id="user" placeholder="Enter your mail id" required>
            <input type="password" id="password" placeholder="Enter your password" required>
            
            <label>
                <input type="checkbox" id="showPassword" 
                onchange="document.getElementById('password').type = this.checked ? 'text' : 'password'">Show Password
            </label>
            <form action="#" onsubmit="return false;">

                           
            <button class="login">Log In</button>
            
        </section>        
        
    </div>
    <div class="outsite">
             
            <!-- <a href="about.html" class="signup">Don't have an account?"Singn up"</a> -->

    </div>
    
</body>
</html>
